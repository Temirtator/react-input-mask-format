name: CI
on:
  push:
    branches: [master, next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx publint
      - run: npm run size
      - run: npm run test:dist
      - run: npm run test:coverage

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["17", "18", "19"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - if: matrix.react == '17'
        run: npm i --no-save react@17 react-dom@17 @testing-library/react@12
      - if: matrix.react == '18'
        run: npm i --no-save react@18 react-dom@18
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e -- --project chromium --project firefox
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  e2e-webkit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e -- --project webkit
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit
          path: playwright-report
          retention-days: 7

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["17", "18", "19"]
    defaults:
      run:
        working-directory: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        working-directory: .
      - run: npm run build
        working-directory: .
      - run: npm pack --pack-destination smoke
        working-directory: .
      - run: >-
          npm i --no-save --no-audit --no-fund ./react-input-mask-format-*.tgz
          react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} typescript@5
      - run: node entries.mjs && node entries.cjs
      - run: node ssr.cjs
      - run: ./types.sh
      - if: matrix.react == '19'
        run: cp react-input-mask-format-*.tgz next/
      - if: matrix.react == '19'
        working-directory: smoke/next
        run: >-
          npm i --no-save --no-audit --no-fund ./react-input-mask-format-*.tgz
          next@15 react@19 react-dom@19 @types/react@19 @types/react-dom@19 @types/node@22 typescript@5
      - if: matrix.react == '19'
        working-directory: smoke/next
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  pages-build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [checks, test, e2e, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run demo:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
