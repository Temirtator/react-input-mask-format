name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC trusted publishing to npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm >= 11.5.1 required for OIDC trusted publishing (node 22 ships npm 10)
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run test
      - run: npm publish --provenance --access public
      # Create the matching GitHub Release from the pushed tag (gh is preinstalled
      # on the runner). --generate-notes builds notes from PRs since the last tag.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --latest --verify-tag
