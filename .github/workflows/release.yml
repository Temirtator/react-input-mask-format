name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm >= 11.5.1 required for OIDC trusted publishing (node 22 ships npm 10)
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run test
      - run: npm publish --provenance --access public
